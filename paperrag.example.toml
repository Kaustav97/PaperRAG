# Copy to paperrag.toml. Paths are relative to this file.
data_dir = "./data"
pdf_dir = "./papers"
embedding_model = "BAAI/bge-small-en-v1.5"
embed_batch_size = 16
threads = 2
ocr_language = "eng"
# One OpenAI-compatible Chat Completions endpoint; no default provider/model.
# Excerpts sent to a hosted endpoint leave your machine. Secrets belong in .env.
base_url = ""
[models.breakdown]
model = ""
[models.breakdown.options]
# Provider-specific arguments, e.g. max_completion_tokens = 4096.
[models.research]
model = ""
[models.research.options]
# Provider extensions go in extra_body, not as SDK keyword arguments.
# For a compatible Fusion endpoint, set models.research.model to "openrouter/fusion"
# and uncomment the following table (model/preset availability is endpoint-specific):
# [models.research.options.extra_body]
# plugins = [{ id = "fusion", preset = "general-budget" }]
# UI Research > Model settings can override each stage for the current session.
[models.synthesis]
model = ""
[models.synthesis.options]
